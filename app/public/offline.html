<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Little Chef Pizza</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 360px;
      padding: 32px 24px 28px;
      background: #121212;
      border: 1px solid #262626;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(226, 34, 42, 0.12);
      color: #e2222a;
    }
    .icon svg { width: 36px; height: 36px; }
    h1 { font-size: 20px; font-weight: 700; line-height: 1.3; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.5; color: #a3a3a3; margin-bottom: 26px; }
    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #e2222a;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.6; }
    .hint { margin-top: 14px; font-size: 13px; color: #737373; min-height: 18px; }
  </style>
</head>
<body>
  <main class="card" role="alert" aria-live="polite">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
        <path d="M5 13a10 10 0 0 1 5.24-2.76" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1 id="title">No Internet Connection</h1>
    <p id="message">Please check your Wi-Fi or mobile data and try again.</p>
    <button id="retry" type="button">Try Again</button>
    <div class="hint" id="hint"></div>
  </main>

  <script>
    (function () {
      var APP_URL = "https://little-chef-pizza.vercel.app/";
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var hint = document.getElementById("hint");
      var retry = document.getElementById("retry");

      function render() {
        if (navigator.onLine) {
          title.textContent = "Connection Problem";
          message.textContent = "We couldn't reach Little Chef Pizza. Please check your internet connection and try again.";
        } else {
          title.textContent = "No Internet Connection";
          message.textContent = "Please check your Wi-Fi or mobile data and try again.";
        }
      }

      function reload() {
        retry.disabled = true;
        retry.textContent = "Connecting...";
        hint.textContent = "";
        window.location.replace(APP_URL);
      }

      retry.addEventListener("click", function () {
        if (!navigator.onLine) {
          hint.textContent = "Still offline. Please connect to the internet.";
          return;
        }
        reload();
      });

      window.addEventListener("online", reload);
      window.addEventListener("offline", render);
      render();
    })();
  </script>
</body>
</html>
