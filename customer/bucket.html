<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bucket — Little Chef Pizza</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/images/logo/favicon.svg"
    />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#e2222a" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/customer.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <section class="section container">
      <h1>Your Bucket</h1>

      <div id="bucket-empty" class="empty-state" hidden>
        <div class="empty-state__icon">🧺</div>
        <h3>Your bucket is empty</h3>
        <p>Add something delicious from the menu to get started.</p>
        <a href="menu.html" class="btn btn--primary" style="margin-top: 14px"
          >Browse Menu</a
        >
      </div>

      <div class="bucket-layout" id="bucket-content">
        <div class="card">
          <div id="bucket-lines"></div>
          <button
            class="btn btn--ghost btn--sm"
            id="clear-bucket"
            style="margin-top: 14px"
          >
            Clear Bucket
          </button>
        </div>
        <div class="card">
          <h3>Order Summary</h3>
          <div id="bucket-warning"></div>
          <div class="summary-row">
            <span>Subtotal</span><span id="sum-subtotal">Rs. 0</span>
          </div>
          <div class="summary-row">
            <span>Delivery</span><span>TBD at checkout</span>
          </div>
          <div class="summary-row summary-row--total">
            <span>Total</span><span id="sum-total">Rs. 0</span>
          </div>
          <a
            href="checkout.html"
            class="btn btn--primary btn--block"
            id="checkout-btn"
            style="margin-top: 14px"
            >Proceed to Checkout</a
          >
        </div>
      </div>
    </section>

    <script src="../js/seed-data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/cart-ui.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/notify.js"></script>
    <script>
      async function renderBucket() {
        await LCP_loadCatalogCache();
        const state = LCP_CART.getState();
        const empty = state.items.length === 0 && state.deals.length === 0;
        document.getElementById("bucket-empty").hidden = !empty;
        document.getElementById("bucket-content").style.display = empty
          ? "none"
          : "grid";
        if (empty) return;

        const linesEl = document.getElementById("bucket-lines");
        linesEl.innerHTML = "";
        state.items.forEach((i) =>
          linesEl.appendChild(LCP_CART_UI.lineRow(i, false)),
        );
        state.deals.forEach((d) =>
          linesEl.appendChild(LCP_CART_UI.lineRow(d, true)),
        );

        document.getElementById("sum-subtotal").textContent = LCP_UTIL.pkr(
          state.subtotal,
        );
        document.getElementById("sum-total").textContent = LCP_UTIL.pkr(
          state.subtotal,
        );

        const warnEl = document.getElementById("bucket-warning");
        warnEl.innerHTML = "";
        const checkoutBtn = document.getElementById("checkout-btn");
        if (state.hasIssue) {
          warnEl.appendChild(
            LCP_UTIL.el(
              "div",
              { class: "notice-box" },
              "Some items in your bucket are no longer available. Please remove them before checking out.",
            ),
          );
          checkoutBtn.classList.add("btn--disabled-look");
          checkoutBtn.setAttribute("aria-disabled", "true");
        } else {
          checkoutBtn.classList.remove("btn--disabled-look");
          checkoutBtn.removeAttribute("aria-disabled");
        }
      }

      document
        .getElementById("checkout-btn")
        .addEventListener("click", (e) => {
          if (e.currentTarget.getAttribute("aria-disabled") === "true") {
            e.preventDefault();
            LCP_UTIL.toast(
              "Remove unavailable items from your bucket first.",
              "error",
            );
          }
        });

      document
        .getElementById("clear-bucket")
        .addEventListener("click", async () => {
          const ok = await LCP_UTIL.confirmDialog(
            "Clear everything from your bucket?",
            { confirmText: "Clear", danger: true },
          );
          if (ok) {
            LCP_CART.clear();
            renderBucket();
            LCP_UTIL.toast("Bucket cleared.", "info");
          }
        });

      (async () => {
        await LCP_NAV.mountCustomer("bucket", { noBucketBar: true });
        LCP_CART.onChange(() => renderBucket());
        renderBucket();
      })();
    </script>
  </body>
</html>
