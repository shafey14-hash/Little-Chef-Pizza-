<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Little Chef Pizza</title>
<link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/customer.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<section class="section container" style="max-width:960px;">
  <div id="product-detail-loading">
    <div class="skeleton" style="height:400px; border-radius:22px;"></div>
  </div>

  <div class="empty-state" id="product-detail-notfound" hidden>
    <div class="empty-state__icon">🍕</div>
    <h3>Product not found</h3>
    <p>This item may have been removed from the menu.</p>
    <a href="menu.html" class="btn btn--primary" style="margin-top:14px;">Browse Menu</a>
  </div>

  <div id="product-detail-root" hidden></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/db.js"></script>
<script src="../js/seed-data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/nav.js"></script>
<script>
  (async () => {
    await LCP_NAV.mountCustomer("menu");
    LCP_MENU.initProductPage();
  })();
</script>
</body>
</html>
