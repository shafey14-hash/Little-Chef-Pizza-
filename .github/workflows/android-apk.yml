# Builds the React Native (Expo) Android app locally on GitHub Actions and publishes the
# APK to the website root as app.apk — Vercel then serves it at
# https://little-chef-pizza.vercel.app/app.apk.
#
# It ALSO publishes an EAS Update (OTA) on every mobile push: the installed
# app picks up JS-only changes on its next launch — no APK reinstall needed.
# Native changes (new packages, config plugins, version bumps) still need the
# new APK from this workflow.
#
# One-time GitHub secrets:
#   GOOGLE_SERVICES_JSON_BASE64   — single-line base64 of google-services.json
#                                   created with: base64 -w0 google-services.json
#   EXPO_TOKEN                    — Expo access token (expo.dev → account →
#                                   Settings → Access Tokens). If missing, the
#                                   OTA job is skipped and only the APK builds.

name: Build Android APK (Local CI)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  ota-update:
    name: Publish EAS Update (JS over-the-air)
    runs-on: ubuntu-latest
    env:
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - name: Notice when EXPO_TOKEN is missing
        if: env.HAS_EXPO != 'true'
        run: echo "EXPO_TOKEN secret not set — skipping OTA publish (the APK build still runs)."

      - uses: actions/checkout@v4
        if: env.HAS_EXPO == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_EXPO == 'true'
        with:
          node-version: 22

      - name: Install mobile app dependencies
        if: env.HAS_EXPO == 'true'
        working-directory: mobile
        run: npm ci

      # Publishes the JS bundle to the "production" channel under the
      # runtimeVersion from app.json (policy: appVersion). Installed apps
      # whose native version matches receive it automatically at launch.
      - name: Publish EAS Update
        if: env.HAS_EXPO == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --channel production --non-interactive

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_FCM: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fail fast if the Firebase config secret is missing
        if: env.HAS_FCM != 'true'
        run: |
          echo "FAIL: the GOOGLE_SERVICES_JSON_BASE64 secret is not set."
          exit 1

      - name: Decode google-services.json
        if: env.HAS_FCM == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        working-directory: mobile
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          if ! grep -q '"project_id"' google-services.json; then
            echo "FAIL: GOOGLE_SERVICES_JSON_BASE64 decoded but is not a google-services.json."
            exit 1
          fi
          echo "OK: google-services.json decoded"

      - name: Install mobile app dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Prebuild (Generate Android Native Code)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK (Gradle)
        working-directory: mobile/android
        # Bypass strict linting on third-party libraries (like react-native-screens)
        # which often causes false-positive failures in CI environments.
        run: ./gradlew assembleRelease -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Copy APK to Root
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk app.apk
          ls -lh app.apk

      - name: Publish app.apk to the website root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.apk
          if git diff --cached --quiet; then
            echo "APK unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Publish latest app.apk (Local CI build)"
          git push
          echo "Pushed app.apk"
