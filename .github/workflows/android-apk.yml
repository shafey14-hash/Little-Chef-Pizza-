# React Native (Expo) app — kept so already-installed RN apps keep working.
#
# ota-update: publishes an EAS Update (OTA) on every mobile push; installed RN
# apps pick up JS-only changes on their next launch.
# build: manual only (Actions tab → Run workflow); uploads the RN APK as a
# workflow artifact. The public app.apk is built by android-webview-apk.yml.
#
# One-time GitHub secrets:
#   GOOGLE_SERVICES_JSON_BASE64   — single-line base64 of google-services.json
#                                   created with: base64 -w0 google-services.json
#   EXPO_TOKEN                    — Expo access token (expo.dev → account →
#                                   Settings → Access Tokens). If missing, the
#                                   OTA job is skipped and only the APK builds.

name: Build Android APK (Local CI)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  ota-update:
    name: Publish EAS Update (JS over-the-air)
    runs-on: ubuntu-latest
    env:
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - name: Notice when EXPO_TOKEN is missing
        if: env.HAS_EXPO != 'true'
        run: echo "EXPO_TOKEN secret not set — skipping OTA publish (the APK build still runs)."

      - uses: actions/checkout@v4
        if: env.HAS_EXPO == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_EXPO == 'true'
        with:
          node-version: 22

      - name: Install mobile app dependencies
        if: env.HAS_EXPO == 'true'
        working-directory: mobile
        run: npm ci

      # Publishes the JS bundle to the "production" channel under the
      # runtimeVersion from app.json (policy: appVersion). Installed apps
      # whose native version matches receive it automatically at launch.
      - name: Publish EAS Update
        if: env.HAS_EXPO == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --channel production --message "$(git log -1 --pretty=%s)" --non-interactive

  # The website's app.apk now comes from android-webview-apk.yml. This RN build
  # runs only when started manually and never overwrites app.apk.
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_FCM: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fail fast if the Firebase config secret is missing
        if: env.HAS_FCM != 'true'
        run: |
          echo "FAIL: the GOOGLE_SERVICES_JSON_BASE64 secret is not set."
          exit 1

      - name: Decode google-services.json
        if: env.HAS_FCM == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        working-directory: mobile
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          if ! grep -q '"project_id"' google-services.json; then
            echo "FAIL: GOOGLE_SERVICES_JSON_BASE64 decoded but is not a google-services.json."
            exit 1
          fi
          echo "OK: google-services.json decoded"

      - name: Install mobile app dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Prebuild (Generate Android Native Code)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK (Gradle)
        working-directory: mobile/android
        # Bypass strict linting on third-party libraries (like react-native-screens)
        # which often causes false-positive failures in CI environments.
        run: ./gradlew assembleRelease -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Upload RN APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rn-app-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
